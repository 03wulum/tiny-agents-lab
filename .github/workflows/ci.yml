name: ci
on: [push, pull_request]
jobs:
  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests
        run: |
          for d in experiments/*/; do [ -d "$d" ] || continue; (cd "$d" && python -m pytest -q); done
      - name: Quick evaluation (no training; training runs on GPU only)
        run: python run_all.py
